name: Feature request
description: Propose an improvement with a clear user or operational outcome
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become easier, faster, safer, or more capable?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters and who benefits.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What evidence would show this is done?
